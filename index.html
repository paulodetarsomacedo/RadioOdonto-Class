<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RadioOdonto - UNIFSA</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --bg-color: #e0e5ec;
            --shadow-light: #ffffff;
            --shadow-dark: #a3b1c6;
            --primary-color: #3b82f6;
            --text-color: #4b5563;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            overflow-x: hidden; 
            background-color: var(--bg-color); 
            color: var(--text-color);
            user-select: none; -webkit-user-select: none;
        }

        /* Neumorfismo */
        .neo-panel { background: var(--bg-color); box-shadow: 9px 9px 16px var(--shadow-dark), -9px -9px 16px var(--shadow-light); border-radius: 1.5rem; }
        .neo-button { background: var(--bg-color); box-shadow: 6px 6px 10px var(--shadow-dark), -6px -6px 10px var(--shadow-light); border-radius: 0.75rem; transition: all 0.2s ease; color: var(--text-color); font-weight: 600; }
        .neo-button:active { box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light); transform: scale(0.96); }
        .neo-pressed { background: var(--bg-color); box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light); border-radius: 0.75rem; color: var(--primary-color); font-weight: 600; }
        .neo-inset { background: var(--bg-color); box-shadow: inset 6px 6px 12px var(--shadow-dark), inset -6px -6px 12px var(--shadow-light); border-radius: 1rem; }
        .neo-screen { background: #1f2328; box-shadow: inset 10px 10px 20px #111316, inset -10px -10px 20px #2d333a; border-radius: 1rem; }

        /* Color Picker Customizado */
        input[type="color"] { -webkit-appearance: none; border: none; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; padding: 0; cursor: pointer; }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }

        #canvas-wrapper, .canvas-container { touch-action: none !important; margin: 0 auto; }
        #overlay-body, #modal-resize-handle { touch-action: none !important; }

        @keyframes loadingBar { 0% { transform: translateX(-100%); } 100% { transform: translateX(200%); } }
        .animate-loading-bar { animation: loadingBar 1.5s infinite linear; }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- LOADING SCREEN NEUMÓRFICA PREMIUM -->
    <div id="loading-screen" class="fixed inset-0 z-[999] bg-[#e0e5ec] flex flex-col items-center justify-center transition-opacity duration-1000 pointer-events-auto">
        <div class="neo-panel p-8 flex flex-col items-center max-w-sm text-center mx-4 relative overflow-hidden">
            
            <!-- Logo Neumórfico -->
            <div class="w-28 h-28 neo-panel rounded-full flex items-center justify-center mb-6 border-4 border-[#e0e5ec] shadow-[8px_8px_16px_#a3b1c6,-8px_-8px_16px_#ffffff]">
                <i class="fa-solid fa-tooth text-transparent bg-clip-text bg-gradient-to-br from-blue-400 to-blue-600 text-5xl filter drop-shadow-sm animate-pulse"></i>
            </div>
            
            <h1 class="text-3xl font-extrabold text-gray-500 mb-2 tracking-widest uppercase">RadioOdonto</h1>
            <div class="text-[10px] uppercase font-bold text-blue-500 tracking-[0.2em] mb-6">Educação e Laudo</div>
            
            <!-- Barra de Progresso Glow -->
            <div class="w-full h-3 neo-inset rounded-full overflow-hidden mb-6 relative">
                <div class="absolute top-0 left-0 h-full w-1/2 bg-gradient-to-r from-blue-400 to-blue-600 rounded-full animate-loading-bar shadow-[0_0_10px_rgba(59,130,246,0.6)]"></div>
            </div>
            
            <div class="text-xs font-bold text-gray-600 mb-1">Prof. Dr. Paulo de Tarso S. de Macedo</div>
            <div class="text-[10px] text-gray-400 font-semibold tracking-wide">em parceria com o núcleo de T.I da UNIFSA</div>
        </div>
    </div>

    <!-- HEADER -->
    <header class="p-3 flex flex-col gap-3 z-10">
        <div class="text-center text-xl font-bold text-gray-600 tracking-wide drop-shadow-sm flex items-center justify-center gap-2">
            <i class="fa-solid fa-tooth text-blue-500"></i> RadioOdonto UNIFSA
        </div>
        <nav class="flex justify-around gap-3 px-1">
            <button onclick="mudarAba('anatomia')" id="tab-btn-anatomia" class="flex-1 py-2 neo-pressed text-sm">Anatomia</button>
            <button onclick="mudarAba('estudo')" id="tab-btn-estudo" class="flex-1 py-2 neo-button text-sm">Estudo</button>
            <button onclick="mudarAba('relatorio')" id="tab-btn-relatorio" class="flex-1 py-2 neo-button text-sm">Relatório</button>
        </nav>
    </header>

    <main class="flex-1 overflow-y-auto relative px-3 pb-3 flex flex-col">
        
        <!-- ================= ABA ANATOMIA ================= -->
        <div id="aba-anatomia" class="flex-1 flex flex-col gap-3 h-full">
            
            <div class="neo-panel p-3 flex gap-2 flex-wrap items-center justify-between z-10">
                <label class="neo-button px-4 py-2 cursor-pointer text-sm flex items-center gap-2 text-blue-600 w-full sm:w-auto justify-center">
                    <i class="fa-solid fa-camera"></i> Subir Imagem
                    <input type="file" id="image-upload" accept="image/*" class="hidden">
                </label>
                <div class="flex-1 w-full relative">
                    <select id="overlay-selector" onchange="mostrarOverlay(this.value)" class="w-full neo-inset p-2 rounded-lg text-sm appearance-none outline-none text-gray-600 bg-transparent font-semibold">
                        <option value="">+ Esquema (Overlay)</option>
                    </select>
                    <i class="fa-solid fa-chevron-down absolute right-3 top-3 pointer-events-none text-gray-400"></i>
                </div>
            </div>

            <!-- BARRA DE FERRAMENTAS (GRID) -->
            <div class="neo-panel p-3 z-10 flex flex-col gap-3">
                <div class="grid grid-cols-4 sm:grid-cols-8 gap-2 text-[10px] sm:text-xs text-center font-bold">
                    <button onclick="setTool('edit')" id="btn-edit" class="neo-pressed p-2 flex flex-col items-center justify-center gap-1 text-gray-700"><i class="fa-solid fa-arrow-pointer text-lg"></i> Selecionar</button>
                    <button onclick="setTool('pan')" id="btn-pan" class="neo-button p-2 flex flex-col items-center justify-center gap-1 text-blue-500"><i class="fa-solid fa-hand text-lg"></i> Mover</button>
                    <button onclick="setTool('draw')" id="btn-draw" class="neo-button p-2 flex flex-col items-center justify-center gap-1 text-red-500"><i class="fa-solid fa-pen text-lg"></i> Desenhar</button>
                    
                    <div class="neo-button p-1 flex flex-col items-center justify-center">
                        <div class="w-8 h-8 rounded-full border-2 border-white shadow-inner overflow-hidden relative">
                            <input type="color" id="color-picker" value="#ffff00" class="absolute -top-2 -left-2 w-12 h-12">
                        </div>
                    </div>

                    <button onclick="addText()" class="neo-button p-2 flex flex-col items-center justify-center gap-1 text-gray-700"><i class="fa-solid fa-font text-lg"></i> Texto</button>
                    <button onclick="addArrow()" class="neo-button p-2 flex flex-col items-center justify-center gap-1 text-gray-700"><i class="fa-solid fa-arrow-right-long text-lg"></i> Seta</button>
                    <button onclick="addPolygon()" class="neo-button p-2 flex flex-col items-center justify-center gap-1 text-gray-700"><i class="fa-solid fa-play text-lg"></i> Área</button>
                    <button onclick="addLine()" class="neo-button p-2 flex flex-col items-center justify-center gap-1 text-gray-700"><i class="fa-solid fa-minus text-lg"></i> Linha</button>
                </div>

                <div class="grid grid-cols-3 gap-2 text-xs font-bold mt-1">
                    <button onclick="editActiveText()" class="neo-button py-2 text-yellow-600"><i class="fa-solid fa-pen-to-square"></i> Editar Texto</button>
                    <button onclick="deleteSelected()" class="neo-button py-2 text-red-400"><i class="fa-solid fa-eraser"></i> Apagar Item</button>
                    <button onclick="clearCanvas()" class="neo-button py-2 text-red-600"><i class="fa-solid fa-trash"></i> Limpar Tudo</button>
                </div>
            </div>

            <div id="canvas-wrapper" class="flex-1 neo-screen relative flex justify-center items-center overflow-hidden">
                <canvas id="fabric-canvas"></canvas>
            </div>
            
            <button onclick="saveImage()" class="w-full py-3 neo-button text-blue-600 uppercase tracking-wider text-sm font-bold mt-1"><i class="fa-solid fa-save"></i> Salvar na Aba Relatório</button>
        </div>

        <!-- ================= ABA ESTUDO ================= -->
        <div id="aba-estudo" class="hidden h-full flex-col">
            <h2 class="text-lg font-extrabold mb-4 text-center text-gray-500 uppercase tracking-widest mt-2">Esquemas de Referência</h2>
            <div id="estudo-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 p-2 pb-10"></div>
        </div>

        <!-- ================= ABA RELATÓRIO ================= -->
        <div id="aba-relatorio" class="hidden h-full flex-col gap-3">
            
            <!-- Campo de Nome do Aluno para o PDF -->
            <div class="neo-panel p-3 mb-1 flex items-center gap-3">
                <div class="w-10 h-10 neo-inset rounded-full flex items-center justify-center text-blue-500">
                    <i class="fa-solid fa-user-graduate"></i>
                </div>
                <input type="text" id="nome-aluno" placeholder="Digite seu nome para o Laudo..." class="bg-transparent border-none outline-none flex-1 text-sm text-gray-700 font-bold placeholder-gray-400">
            </div>

            <div id="galeria-salvas" class="neo-inset flex-1 p-4 overflow-y-auto grid grid-cols-2 sm:grid-cols-3 gap-4 content-start">
                <p class="text-gray-400 col-span-2 text-sm italic w-full text-center py-10">Nenhuma imagem salva ainda.</p>
            </div>
            <div class="neo-panel p-4 grid grid-cols-1 sm:grid-cols-2 gap-3">
                <button onclick="gerarPDF(false)" class="w-full py-3 neo-button text-red-500 text-sm font-bold"><i class="fa-solid fa-file-pdf"></i> Baixar PDF</button>
                <button onclick="gerarPDF(true)" class="w-full py-3 neo-button text-green-500 text-sm font-bold"><i class="fa-brands fa-whatsapp"></i> Enviar (Whats/Email)</button>
            </div>
        </div>
    </main>

    <!-- ================= OVERLAY MODAL ================= -->
    <div id="overlay-schema" class="hidden absolute top-48 left-6 neo-panel z-50 flex flex-col bg-[#e0e5ec] overflow-hidden" style="width: 200px; height: 200px; min-width: 120px; min-height: 120px; max-width: 95vw; max-height: 80vh;">
        <div id="overlay-header" class="px-2 py-2 flex justify-between items-center cursor-move border-b border-gray-300">
            <span class="font-bold text-[10px] text-gray-500 tracking-wider"><i class="fa-solid fa-grip-lines mr-1"></i> ARRASTAR</span>
            <button onclick="fecharOverlay()" class="neo-button w-6 h-6 flex items-center justify-center text-xs text-red-500 pointer-events-auto">X</button>
        </div>
        <div id="overlay-body" class="flex-1 neo-inset m-1 relative cursor-grab flex items-center justify-center overflow-hidden bg-white">
            <img id="overlay-img" src="" class="max-w-none max-h-none origin-center pointer-events-none mix-blend-multiply" style="transform: translate(0px, 0px) scale(1);" />
        </div>
        <div id="modal-resize-handle" class="absolute bottom-0 right-0 w-8 h-8 flex items-end justify-end p-2 cursor-se-resize bg-transparent z-10">
            <i class="fa-solid fa-signal fa-flip-horizontal text-gray-400 text-[10px] opacity-70"></i>
        </div>
    </div>

    <!-- ================= LIGHTBOX ================= -->
    <div id="lightbox" class="hidden fixed inset-0 z-[100] bg-[#e0e5ec] flex flex-col justify-center items-center p-4 transition-opacity">
        <button onclick="fecharLightbox()" class="absolute top-6 right-6 neo-button w-12 h-12 text-2xl text-red-500 font-bold">&times;</button>
        <h3 id="lightbox-title" class="text-gray-600 text-xl mb-6 font-extrabold uppercase tracking-widest drop-shadow-sm text-center"></h3>
        <div class="neo-panel p-4 max-w-full max-h-[75vh]">
            <img id="lightbox-img" src="" class="max-w-full max-h-[70vh] object-contain rounded-xl mix-blend-multiply">
        </div>
    </div>

    <!-- ================= LÓGICA / JAVASCRIPT ================= -->
    <script>
        const esquemasAnatomicos =[
            { id: '1', nome: 'Incisivos Sup', url: 'incisivos_sup.jpg' },
            { id: '2', nome: 'Caninos Sup', url: 'caninos_sup.jpg' },
            { id: '3', nome: 'Pré-molares Sup', url: 'pre_molares_sup.jpg' },
            { id: '4', nome: 'Molares Sup', url: 'molares_sup.jpg' },
            { id: '5', nome: 'Incisivos Inf', url: 'incisivos_inf.jpg' },
            { id: '6', nome: 'Caninos Inf', url: 'caninos_inf.jpg' },
            { id: '7', nome: 'Pré-molares Inf', url: 'pre_molares_inf.jpg' },
            { id: '8', nome: 'Molares Inf', url: 'molares_inf.jpg' }
        ];

        let canvas;
        let isPanning = false; 
        let imagensSalvas =[];
        let olZoom = 1, olPosX = 0, olPosY = 0;

        window.onload = () => {
            // Loading Screen Animation
            setTimeout(() => {
                const loader = document.getElementById('loading-screen');
                loader.classList.add('opacity-0');
                setTimeout(() => loader.remove(), 1000);
            }, 2000);

            initCanvas();
            carregarEstudos();
            configurarDraggableModal();
            configurarResizeModal(); 
            configurarPanZoomOverlayImage(); 
            configurarZoomPinçaCanvas(); 
            setTool('edit');

            // Evento Mudar Cor Global
            document.getElementById('color-picker').addEventListener('input', function(e) {
                const cor = e.target.value;
                canvas.freeDrawingBrush.color = cor;
                const act = canvas.getActiveObject();
                if(act) {
                    if(act.type === 'text') act.set('fill', cor);
                    else if(['path','line','triangle'].includes(act.type)) act.set('stroke', cor);
                    else if(act.type === 'group') {
                        act.getObjects().forEach(o => { o.set('stroke', cor); if(o.type !== 'line') o.set('fill', cor); });
                    }
                    canvas.renderAll();
                }
            });
        };

        function mudarAba(aba) {['anatomia', 'estudo', 'relatorio'].forEach(a => {
                document.getElementById(`aba-${a}`).classList.add('hidden');
                document.getElementById(`aba-${a}`).classList.remove('flex');
                document.getElementById(`tab-btn-${a}`).className = "flex-1 py-2 text-sm neo-button transition";
            });
            const current = document.getElementById(`aba-${aba}`);
            current.classList.remove('hidden'); current.classList.add('flex');
            document.getElementById(`tab-btn-${aba}`).className = "flex-1 py-2 text-sm neo-pressed transition";
            if(aba === 'anatomia' && canvas) canvas.calcOffset();
        }

        function getClientX(e) { return e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX; }
        function getClientY(e) { return e.touches && e.touches.length > 0 ? e.touches[0].clientY : e.clientY; }

        function initCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            canvas = new fabric.Canvas('fabric-canvas', {
                width: wrapper.clientWidth, height: wrapper.clientHeight,
                isDrawingMode: false, selection: true
            });
            canvas.freeDrawingBrush.color = document.getElementById('color-picker').value;
            canvas.freeDrawingBrush.width = 3;

            canvas.on('mouse:down', function(opt) {
                if (isPanning) {
                    this.isDragging = true;
                    this.lastPosX = getClientX(opt.e);
                    this.lastPosY = getClientY(opt.e);
                }
            });
            canvas.on('mouse:move', function(opt) {
                if (this.isDragging && isPanning) {
                    var vpt = this.viewportTransform;
                    vpt[4] += getClientX(opt.e) - this.lastPosX;
                    vpt[5] += getClientY(opt.e) - this.lastPosY;
                    this.requestRenderAll();
                    this.lastPosX = getClientX(opt.e);
                    this.lastPosY = getClientY(opt.e);
                }
            });
            canvas.on('mouse:up', function() { this.isDragging = false; });

            canvas.on('mouse:wheel', function(opt) {
                var zoom = canvas.getZoom() * (0.999 ** opt.e.deltaY);
                if (zoom > 10) zoom = 10; if (zoom < 0.1) zoom = 0.1;
                canvas.zoomToPoint({ x: opt.e.offsetX, y: opt.e.offsetY }, zoom);
                opt.e.preventDefault(); opt.e.stopPropagation();
            });

            window.addEventListener('resize', () => { canvas.setWidth(wrapper.clientWidth); canvas.setHeight(wrapper.clientHeight); });
        }

        function configurarZoomPinçaCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            let distInicial = null, zoomInicial = 1;
            wrapper.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2) {
                    e.preventDefault();
                    distInicial = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                    zoomInicial = canvas.getZoom();
                }
            }, {passive: false});

            wrapper.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2 && distInicial) {
                    e.preventDefault();
                    let distAtual = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                    let novoZoom = Math.min(Math.max(zoomInicial * (distAtual / distInicial), 0.1), 10);
                    canvas.zoomToPoint(new fabric.Point((e.touches[0].clientX + e.touches[1].clientX) / 2, (e.touches[0].clientY + e.touches[1].clientY) / 2), novoZoom);
                }
            }, {passive: false});
        }

        document.getElementById('image-upload').addEventListener('change', function(e) {
            const file = e.target.files[0]; if(!file) return;
            const reader = new FileReader();
            reader.onload = function(f) {
                fabric.Image.fromURL(f.target.result, function(img) {
                    const scale = Math.min(canvas.width / img.width, canvas.height / img.height);
                    img.set({ originX: 'center', originY: 'center', left: canvas.width / 2, top: canvas.height / 2, scaleX: scale, scaleY: scale });
                    canvas.setViewportTransform([1, 0, 0, 1, 0, 0]);
                    canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas));
                });
            };
            reader.readAsDataURL(file);
        });

        function setTool(tool) {['pan', 'draw', 'edit'].forEach(b => {
                document.getElementById(`btn-${b}`).classList.replace('neo-pressed', 'neo-button');
                document.getElementById(`btn-${b}`).classList.remove('text-gray-700', 'text-blue-500', 'text-red-500');
            });
            const btn = document.getElementById(`btn-${tool}`);
            btn.classList.replace('neo-button', 'neo-pressed');

            if(tool === 'pan') {
                btn.classList.add('text-blue-500');
                isPanning = true; canvas.isDrawingMode = false;
                canvas.forEachObject(o => o.selectable = false); canvas.discardActiveObject(); canvas.requestRenderAll();
            } else if (tool === 'edit') {
                btn.classList.add('text-gray-700');
                isPanning = false; canvas.isDrawingMode = false;
                canvas.forEachObject(o => o.selectable = true);
            } else if (tool === 'draw') {
                btn.classList.add('text-red-500');
                isPanning = false; canvas.isDrawingMode = true;
                canvas.freeDrawingBrush.color = document.getElementById('color-picker').value;
                canvas.forEachObject(o => o.selectable = false); canvas.discardActiveObject(); canvas.requestRenderAll();
            }
        }

        function addText() {
            setTool('edit');
            const userText = prompt("Digite o texto da anotação:");
            if(!userText || userText.trim() === "") return;
            const cor = document.getElementById('color-picker').value;
            const text = new fabric.Text(userText, { left: canvas.width / 2, top: canvas.height / 2, originX: 'center', originY: 'center', fontFamily: 'Arial', fill: cor, fontSize: 24, fontWeight: 'bold' });
            canvas.add(text); canvas.setActiveObject(text);
        }

        function editActiveText() {
            const act = canvas.getActiveObject();
            if(act && act.type === 'text') {
                const userText = prompt("Alterar texto:", act.text);
                if(userText) { act.set('text', userText); canvas.renderAll(); }
            } else { alert("Toque em um texto existente primeiro para editá-lo."); }
        }

        function addLine() { setTool('edit'); const cor = document.getElementById('color-picker').value; const line = new fabric.Line([50, 50, 200, 50], { stroke: cor, strokeWidth: 4, selectable: true, hasControls: true, hasBorders: true, left: canvas.width / 2 - 75, top: canvas.height / 2 }); canvas.add(line); }
        function addPolygon() { setTool('edit'); const cor = document.getElementById('color-picker').value; const triangle = new fabric.Triangle({ width: 100, height: 100, fill: 'transparent', stroke: cor, strokeWidth: 4, left: canvas.width / 2, top: canvas.height / 2, originX: 'center', originY: 'center' }); canvas.add(triangle); }
        function addArrow() { setTool('edit'); const cor = document.getElementById('color-picker').value; const line = new fabric.Line([0, 0, 100, 0], { stroke: cor, strokeWidth: 4 }); const head = new fabric.Triangle({ width: 18, height: 18, fill: cor, left: 100, top: 0, originX: 'center', originY: 'center', angle: 90 }); const arrow = new fabric.Group([line, head], { left: canvas.width / 2, top: canvas.height / 2, originX: 'center', originY: 'center' }); canvas.add(arrow); }
        function deleteSelected() { const act = canvas.getActiveObjects(); if(act.length) { act.forEach(obj => canvas.remove(obj)); canvas.discardActiveObject(); } }
        function clearCanvas() { if(confirm('Apagar todas as anotações e desenhos?')) { canvas.getObjects().forEach(o => canvas.remove(o)); } }

        function carregarEstudos() {
            const grid = document.getElementById('estudo-grid'); const select = document.getElementById('overlay-selector');
            esquemasAnatomicos.forEach(esq => {
                grid.innerHTML += `<div onclick="abrirLightbox('${esq.url}', '${esq.nome}')" class="neo-panel p-3 flex flex-col items-center cursor-pointer transition transform hover:scale-105"><div class="neo-inset w-full h-32 flex items-center justify-center p-2 mb-3"><img src="${esq.url}" onerror="this.src='https://via.placeholder.com/300x200?text=${esq.nome}'" class="w-full h-full object-contain mix-blend-multiply"></div><h3 class="font-bold text-gray-600 text-xs tracking-wide uppercase">${esq.nome}</h3></div>`;
                select.innerHTML += `<option value="${esq.url}">${esq.nome}</option>`;
            });
        }
        function abrirLightbox(url, nome) { document.getElementById('lightbox-img').src = url; document.getElementById('lightbox-title').innerText = nome; document.getElementById('lightbox').classList.remove('hidden'); }
        function fecharLightbox() { document.getElementById('lightbox').classList.add('hidden'); }

        function mostrarOverlay(url) { const overlay = document.getElementById('overlay-schema'); if (!url) { overlay.classList.add('hidden'); return; } olZoom = 1; olPosX = 0; olPosY = 0; atualizarOverlayTransform(); document.getElementById('overlay-img').src = url; overlay.classList.remove('hidden'); }
        function fecharOverlay() { document.getElementById('overlay-schema').classList.add('hidden'); document.getElementById('overlay-selector').value = ""; }

        function configurarDraggableModal() {
            const overlay = document.getElementById('overlay-schema'); const header = document.getElementById('overlay-header');
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            header.addEventListener('touchstart', dragStart, {passive: false}); header.addEventListener('mousedown', dragStart);
            function dragStart(e) { if(e.target.tagName.toLowerCase() === 'button') return; e.preventDefault(); pos3 = getClientX(e); pos4 = getClientY(e); document.onmouseup = closeDrag; document.ontouchend = closeDrag; document.onmousemove = elementDrag; document.ontouchmove = elementDrag; }
            function elementDrag(e) { e.preventDefault(); pos1 = pos3 - getClientX(e); pos2 = pos4 - getClientY(e); pos3 = getClientX(e); pos4 = getClientY(e); overlay.style.top = (overlay.offsetTop - pos2) + "px"; overlay.style.left = (overlay.offsetLeft - pos1) + "px"; }
            function closeDrag() { document.onmouseup = null; document.onmousemove = null; document.ontouchend = null; document.ontouchmove = null; }
        }

        function configurarResizeModal() {
            const overlay = document.getElementById('overlay-schema'); const handle = document.getElementById('modal-resize-handle');
            let startW = 0, startH = 0, startX = 0, startY = 0;
            handle.addEventListener('touchstart', initResize, {passive: false}); handle.addEventListener('mousedown', initResize);
            function initResize(e) { e.preventDefault(); startW = parseInt(window.getComputedStyle(overlay).width, 10); startH = parseInt(window.getComputedStyle(overlay).height, 10); startX = getClientX(e); startY = getClientY(e); document.onmousemove = doResize; document.ontouchmove = doResize; document.onmouseup = stopResize; document.ontouchend = stopResize; }
            function doResize(e) { e.preventDefault(); overlay.style.width = (startW + getClientX(e) - startX) + 'px'; overlay.style.height = (startH + getClientY(e) - startY) + 'px'; }
            function stopResize() { document.onmousemove = null; document.ontouchmove = null; document.onmouseup = null; document.ontouchend = null; }
        }

        function atualizarOverlayTransform() { document.getElementById('overlay-img').style.transform = `translate(${olPosX}px, ${olPosY}px) scale(${olZoom})`; }
        function configurarPanZoomOverlayImage() {
            const olBody = document.getElementById('overlay-body'); let isOlDragging = false, olStartX, olStartY; let distInicialOl = null, zoomInicialOl = 1;
            olBody.addEventListener('wheel', (e) => { e.preventDefault(); olZoom *= e.deltaY < 0 ? 1.1 : 0.9; if(olZoom<0.2)olZoom=0.2; if(olZoom>5)olZoom=5; atualizarOverlayTransform(); });
            const downEvent = (e) => { if(e.touches && e.touches.length === 2) { distInicialOl = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); zoomInicialOl = olZoom; return; } isOlDragging = true; olStartX = getClientX(e) - olPosX; olStartY = getClientY(e) - olPosY; };
            const moveEvent = (e) => { if(e.touches && e.touches.length === 2 && distInicialOl) { e.preventDefault(); olZoom = Math.min(Math.max(zoomInicialOl * (Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY) / distInicialOl), 0.2), 5); atualizarOverlayTransform(); return; } if(!isOlDragging) return; e.preventDefault(); olPosX = getClientX(e) - olStartX; olPosY = getClientY(e) - olStartY; atualizarOverlayTransform(); };
            const upEvent = () => { isOlDragging = false; distInicialOl = null; };
            olBody.addEventListener('mousedown', downEvent); document.addEventListener('mousemove', moveEvent); document.addEventListener('mouseup', upEvent);
            olBody.addEventListener('touchstart', downEvent, {passive: false}); document.addEventListener('touchmove', moveEvent, {passive: false}); document.addEventListener('touchend', upEvent);
        }

        function saveImage() {
            canvas.discardActiveObject(); canvas.renderAll();
            const currentZoom = canvas.getZoom(); const currentVpt = canvas.viewportTransform.slice();
            canvas.setViewportTransform([1,0,0,1,0,0]); canvas.setZoom(1);
            const dataUrl = canvas.toDataURL({ format: 'jpeg', quality: 1.0, multiplier: 2 });
            canvas.setViewportTransform(currentVpt); canvas.setZoom(currentZoom);
            imagensSalvas.push(dataUrl); atualizarGaleriaSalvas();
            alert("Sucesso! Imagem salva no Relatório.");
        }

        function atualizarGaleriaSalvas() {
            const div = document.getElementById('galeria-salvas'); div.innerHTML = "";
            if(imagensSalvas.length === 0) { div.innerHTML = `<p class="text-gray-400 col-span-2 text-sm italic w-full text-center py-10">Nenhuma imagem salva ainda.</p>`; return; }
            imagensSalvas.forEach((img, idx) => {
                div.innerHTML += `<div class="relative neo-panel p-2 flex items-center justify-center"><img src="${img}" class="w-full h-32 object-cover rounded-xl border border-gray-300"><div class="absolute top-3 right-3 bg-blue-500 text-white px-2 py-1 text-xs font-bold rounded shadow-md">Fig. ${idx+1}</div></div>`;
            });
        }

        async function gerarPDF(compartilhar) {
            if(imagensSalvas.length === 0) { alert("Nenhuma imagem para o relatório."); return; }
            const nomeAluno = document.getElementById('nome-aluno').value.trim();
            const { jsPDF } = window.jspdf; const pdf = new jsPDF('p', 'mm', 'a4'); const pageWidth = pdf.internal.pageSize.getWidth();
            
            pdf.setFontSize(22); pdf.setTextColor(59, 130, 246); pdf.text("Laudo Radiográfico", 15, 20);
            pdf.setFontSize(12); pdf.setTextColor(100, 100, 100); pdf.text(`Data: ${new Date().toLocaleDateString()}`, 15, 30);
            
            let linhaAtual = 30;
            if(nomeAluno) {
                pdf.setFontSize(14);
                pdf.setTextColor(50, 50, 50);
                pdf.text(`Aluno(a): ${nomeAluno}`, 15, 40);
                linhaAtual = 40;
            }

            pdf.setDrawColor(200, 200, 200);
            pdf.line(15, linhaAtual + 5, pageWidth - 15, linhaAtual + 5);

            let yOffset = linhaAtual + 15;
            for(let i=0; i<imagensSalvas.length; i++) {
                if (yOffset > 220) { pdf.addPage(); yOffset = 20; }
                
                pdf.setFontSize(14); pdf.setFont(undefined, 'bold'); pdf.text(`Imagem ${i+1}:`, 15, yOffset);
                const imgData = imagensSalvas[i];
                const imgProps = pdf.getImageProperties(imgData);
                const maxWidth = pageWidth - 30; 
                let pdfHeight = (imgProps.height * maxWidth) / imgProps.width;
                let pdfWidth = maxWidth;

                if (pdfHeight > 110) { pdfHeight = 110; pdfWidth = (imgProps.width * pdfHeight) / imgProps.height; }
                const xOffset = 15 + (maxWidth - pdfWidth) / 2;

                pdf.setDrawColor(200, 200, 200); 
                pdf.rect(xOffset, yOffset + 5, pdfWidth, pdfHeight);
                pdf.addImage(imgData, 'JPEG', xOffset, yOffset + 5, pdfWidth, pdfHeight);
                yOffset += pdfHeight + 15;
            }

            const nomeArquivo = nomeAluno ? `Laudo_${nomeAluno.replace(/\s+/g, '_')}.pdf` : "Laudo_UNIFSA.pdf";

            if (compartilhar) {
                try {
                    const pdfBlob = pdf.output('blob'); const file = new File([pdfBlob], nomeArquivo, { type: "application/pdf" });
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        await navigator.share({ files:[file], title: 'Laudo RadioOdonto UNIFSA', text: `Laudo em anexo${nomeAluno ? ' de ' + nomeAluno : ''}.` });
                    } else { alert("Aparelho não suporta envio direto."); pdf.save(nomeArquivo); }
                } catch (error) { console.log(error); }
            } else { pdf.save(nomeArquivo); }
        }
    </script>
